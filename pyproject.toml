[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robat"
version = "0.1.0"
description = "A package for predicting battery performance using rotary transformer models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "" }
authors = [
    { name = "junhyeong lee", email = "jun686868@hanyang.ac.kr" },
    { name = "inseop kim", email = "kisdy0924@naver.com" },
]

dependencies = ["torch", "transformers", "hydra-core", "torchdiffeq"]

# TODO: Add optional dependencies if needed
[project.optional-dependencies]
train = [
    "accelerate",
    "datasets>=3.6.0",
    "torchinfo",
    "tensorboardX",
    "wandb",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "openpyxl",
]

[tool.setuptools.packages.find]
include = ["robat*"]

[project.scripts]
robat-train = "robat.scripts.train:main"
robat-eval = "robat.scripts.evaluate:main"
