training_args:
  # strategies
  eval_strategy: "epoch"
  save_strategy: "epoch"

  # batch sizes
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32

  # training
  num_train_steps: 10000 # -1 means use num_train_epochs
  num_train_epochs: 3
  gradient_accumulation_steps: 1

  # logging
  logging_steps: 1
  report_to: "tensorboard"

  # optimizers
  warmup_steps: 1000
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  learning_rate: 5e-5

  # metrics
  load_best_model_at_end: true
  metric_for_best_model: "loss"

callbacks:
  save_top_models_callback:
    _target_: "robat.utils.transformer_trainer_utils.SaveTopModelsCallback"
    top_n: 1
  early_stopping_callback:
    _target_: "transformers.trainer_callback.EarlyStoppingCallback"
    early_stopping_patience: 5

ds:
  _target_: "robat.preprocess.ds_preprocess_for_training"
  ds_name: "Junhyeong86/battery-health-prediction"
  model_purpose: ${model.model_purpose}
  random_time_len: ${model.config.random_time_len}
  sampling_count: 16
  split_cycle_len: 256
  padding_value: ${model.config.padding_value}
  padding_side: ${model.config.padding_side}
  trajectory_pred_len: ${model.config.ode_prediction_len}
