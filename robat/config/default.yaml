hydra:
  run:
    dir: "./log/${model.model_purpose}/${now:%Y-%m-%d_%H-%M-%S_%f}"
  sweep:
    dir: "./log/${model.model_purpose}"
    subdir: "${now:%Y-%m-%d_%H-%M-%S_%f}"

defaults:
  - _self_
  - logging: default
  - model: next_cycle_prediction
  - model/config: default
  - model/from_pretrained: default
  - training/trainer_args: default
  - training/ds: default
  - training/callbacks: default
  - training/lr_scheduler: cosine
  - training/optimizer: adamw

repeat: 1
